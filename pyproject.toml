[project]
name = "slrharness"
version = "0.1.0"
description = "Scientific Literature Review Harness"
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.11"
authors = [
    { name = "Ge Shi", email = "gegshi@amazon.com" },
]
keywords = ["scientific", "literature", "review", "harness", "slr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yourname/slrharness"
Documentation = "https://github.com/yourname/slrharness#readme"
Repository = "https://github.com/yourname/slrharness"
Issues = "https://github.com/yourname/slrharness/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]
viewer = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slrharness"]

[tool.hatch.build.targets.wheel.force-include]
"plugins" = "slrharness/resources/plugins"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["slrharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
